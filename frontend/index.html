<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WvW Combat Analytics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-panel">
        <h1>WvW Analytics</h1>
        <p>Sube tu archivo de Arcdps (.zevtc) para analizar la pelea</p>
        
        <form id="uploadForm">
            <input type="file" id="logFile" accept=".zevtc,.evtc" required>
            <button type="submit" id="submitBtn">Analizar Log</button>
        </form>

        <!-- Contenedor de la barra de progreso -->
        <div id="progressContainer" style="display: none; width: 100%; margin-top: 20px;">
            <div style="background: rgba(255, 255, 255, 0.1); border-radius: 8px; overflow: hidden; height: 10px; width: 100%;">
                <div id="progressBar" style="background: linear-gradient(90deg, #8b5cf6, #c084fc); width: 0%; height: 100%; transition: width 0.1s ease;"></div>
            </div>
            <p id="progressText" style="color: #cbd5e1; font-size: 0.85rem; margin-top: 8px; text-align: center;">Subiendo: 0%</p>
        </div>

        <div id="statusMessage" style="margin-top: 10px;"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
